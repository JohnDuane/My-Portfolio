<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="header" style="font-family: Ethnocentric;">
        Registration form
    </div>

    <form action="index.html">
        <div class="container">
            <label class="heads" for="name">First Name:</label> <br>
            <input class="style" type="text" id="style" name="first_name"> <br>

            <label class="heads" for="lastname">Last Name:</label> <br>
            <input class="style" type="text" id="style" name="last_name"> <br><br>

            <label class="heads" for="birthdate">Date of Birth:</label> <br>
            <input class="style" type="date" id="style" name="date_of_birth">



            <label class="heads" for="birthdate">Gender:</label> <br>

            <fieldset class="radioposition">
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>

                <input type="radio" id="others" name="gender" value="others">
                <label for="others">Others</label>
            </fieldset>

            <label class="heads" for="email">Email:</label> <br>
            <input class="style" type="text" id="email"> <br>

            <label class="heads" for="password">Password:</label> <br>
            <input class="style" type="password" id="password"> <br>

            <label class="heads" for="password">Phone Number:</label> <br>
            <input class="style" type="tel" id="number"> <br> <br>

            <button class="style" style="background-color: rgb(218, 218, 218); font-family: Ethnocentric;">
                Submit
            </button>

        </div>
    </form>
</body>
</html>
